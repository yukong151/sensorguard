name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy,rustfmt" }
      - run: cargo fmt --check
        working-directory: core-rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: core-rust
      - run: cargo test --release
        working-directory: core-rust
      # W11: 基准回归门禁(性能预算,文档 §9)
      - run: cargo bench
        working-directory: core-rust

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/rules.yml
          auditOn: push

  android:
    runs-on: ubuntu-latest
    needs: [rust, semgrep]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android" }
      - run: cargo install cargo-ndk --locked
      - name: Build .so
        working-directory: core-rust
        run: cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release
      # W11: ProGuard/R8 混淆编译验证(proguard-rules.pro 有效性)
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleRelease --no-daemon
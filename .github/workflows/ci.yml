name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy,rustfmt" }
      - run: cargo fmt --check
        working-directory: core-rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: core-rust
      - run: cargo test --release
        working-directory: core-rust
      # W11: 基准回归门禁(性能预算,文档 §9)
      - run: cargo bench
        working-directory: core-rust

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/rules.yml
          auditOn: push

  android:
    runs-on: ubuntu-latest
    needs: [rust, semgrep]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android" }
      - run: cargo install cargo-ndk --locked
      - name: Build .so
        working-directory: core-rust
        run: cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release
      # W11: ProGuard/R8 混淆编译验证(proguard-rules.pro 有效性)
      - run: chmod +x gradlew
      # flavor 有 internal/store,必须用带 flavor 的任务名(store 为上架产物)
      - run: ./gradlew :app:assembleStoreRelease :app:testStoreReleaseUnitTest --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-store-release-apk
          path: app/build/outputs/apk/store/release/app-store-release.apk
          if-no-files-found: error

  mobsf:
    runs-on: ubuntu-latest
    needs: android
    steps:
      # MobSF 静态安全扫描(文档 §7 供应链/合规)。
      # 官方镜像在 GitHub Container Registry(ghcr.io/mobsf/mobsf),
      # 经 REST API 上传 APK → 扫描 → 拉 JSON 报告 → 阈值门禁(高危/严重超限即 CI 失败)。
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-store-release-apk
          path: apk

      - name: Run MobSF and scan
        env:
          MAX_HIGH_RISK: 5
          MAX_CRITICAL_RISK: 2
          MOBSF_API_KEY: insecure_ci_scan
        run: |
          set -euo pipefail
          docker run -d --name mobsf -p 8000:8000 -e MOBSF_API_KEY="${MOBSF_API_KEY}" \
            ghcr.io/mobsf/mobsf:latest
          # 等待 HTTP 就绪(最多 3 分钟:MobSF 首次启动要建库)
          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/v1/scan >/dev/null 2>&1; then ready=1; break; fi
            sleep 3
          done
          if [ "$ready" != "1" ]; then echo "MobSF did not become ready"; exit 1; fi

          APK_FILE=$(ls apk/*.apk | head -1)
          echo "Scanning: ${APK_FILE}"

          UP=$(curl -sf -X POST http://localhost:8000/api/v1/upload \
            -H "Authorization: ${MOBSF_API_KEY}" -F "file=@${APK_FILE}")
          HASH=$(python3 -c "import sys,json;print(json.load(sys.stdin)['hash'])" <<<"${UP}")
          echo "hash=${HASH}"

          curl -sf -X POST http://localhost:8000/api/v1/scan \
            -H "Authorization: ${MOBSF_API_KEY}" -F "hash=${HASH}" -F "scan_type=apk" >/dev/null

          curl -sf -X POST http://localhost:8000/api/v1/report_json \
            -H "Authorization: ${MOBSF_API_KEY}" -F "hash=${HASH}" > mobsf_report.json

          python3 - <<'PY'
          import json, os
          with open("mobsf_report.json") as f:
              r = json.load(f)
          def sev_count(rule):
              return sum(1 for it in rule.get("findings", []) if it[0] in ("high", "critical"))
          high = sev_count(r.get("binary_analysis", {})) + sev_count(r.get("manifest_analysis", {}))
          crit = (sum(1 for it in r.get("binary_analysis", {}).get("findings", []) if it[0] == "critical")
                  + sum(1 for it in r.get("manifest_analysis", {}).get("findings", []) if it[0] == "critical"))
          print(f"MobSF high={high} critical={crit}")
          if crit > int(os.environ["MAX_CRITICAL_RISK"]):
              raise SystemExit(f"FAIL: critical={crit} > {os.environ['MAX_CRITICAL_RISK']}")
          if high > int(os.environ["MAX_HIGH_RISK"]):
              raise SystemExit(f"FAIL: high={high} > {os.environ['MAX_HIGH_RISK']}")
          print("MobSF scan gate passed")
          PY